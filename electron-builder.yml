appId: com.nyahmation.app
productName: Nyahmation
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# FFmpeg is a program the app runs, so it must stay outside the asar archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
fileAssociations:
  - ext: nyah
    name: Nyahmation Project
    role: Editor
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [universal]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
